<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Color Drop Game</title>

<style>

/* ================================
   BASIC
================================ */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;

    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
}

html,
body {
    width: 100%;
    height: 100%;

    overflow: hidden;

    touch-action: none;

    font-family: Arial, sans-serif;
}


/* ================================
   GAME
================================ */

#game {

    position: fixed;

    left: 0;
    top: 0;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    background:
        linear-gradient(
            to bottom,
            #dff6ff,
            #f8fcff
        );
}


/* ================================
   HEADER
================================ */

#header {

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 70px;

    background: white;

    display: flex;
    justify-content: space-around;
    align-items: center;

    box-shadow:
        0 3px 12px rgba(0,0,0,.15);

    z-index: 1000;
}

.stat {
    text-align: center;
}

.stat small {
    display: block;

    color: #777;

    font-size: 11px;

    font-weight: bold;
}

.stat strong {

    display: block;

    margin-top: 3px;

    font-size: 20px;
}


/* ================================
   INSTRUCTION
================================ */

#instruction {

    position: absolute;

    top: 82px;

    left: 50%;

    transform: translateX(-50%);

    width: 92%;

    padding: 12px;

    background: white;

    border-radius: 20px;

    text-align: center;

    font-size: 16px;

    font-weight: bold;

    box-shadow:
        0 4px 12px rgba(0,0,0,.12);

    z-index: 900;
}


/* ================================
   OBJECT
================================ */

.color-object {

    position: absolute;

    width: 72px;
    height: 72px;

    border-radius: 50%;

    display: flex;

    justify-content: center;
    align-items: center;

    font-size: 32px;

    border: 4px solid white;

    box-shadow:
        0 7px 15px rgba(0,0,0,.25),
        inset 0 5px 7px rgba(255,255,255,.5);

    z-index: 2000;

    /*
       VERY IMPORTANT
       Prevent browser scrolling/selection.
    */

    touch-action: none;

    cursor: grab;
}

.color-object.dragging {

    transform: scale(1.2);

    box-shadow:
        0 12px 25px rgba(0,0,0,.35),
        0 0 0 4px white;
}


/* ================================
   COLORS
================================ */

.red {
    background: #ff4747;
}

.blue {
    background: #3485f5;
}

.yellow {
    background: #ffd43b;
}

.green {
    background: #35c96b;
}

.purple {
    background: #a855f7;
}


/* ================================
   BOTTOM BASKETS
================================ */

#basketArea {

    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 175px;

    background: white;

    display: flex;

    justify-content: space-evenly;

    align-items: flex-end;

    padding:
        8px
        3px
        15px;

    box-shadow:
        0 -5px 18px rgba(0,0,0,.15);

    z-index: 100;
}


/* ================================
   BASKET
================================ */

.basket-container {

    width: 18%;

    max-width: 100px;

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 5px;
}

.basket-label {

    font-size: 11px;

    font-weight: bold;

    color: #333;
}

.basket {

    width: 100%;
    height: 90px;

    border-radius:
        12px
        12px
        28px
        28px;

    border: 5px solid white;

    position: relative;

    display: flex;

    justify-content: center;

    align-items: center;

    box-shadow:
        0 5px 12px rgba(0,0,0,.22),
        inset 0 5px 8px rgba(255,255,255,.35);

    /*
       IMPORTANT:
       Basket must accept the touch.
    */

    touch-action: none;

    transition:
        transform .15s,
        box-shadow .15s;
}


/* Basket opening */

.basket::before {

    content: "";

    position: absolute;

    top: -10px;

    left: 5%;

    width: 90%;

    height: 20px;

    border-radius: 50%;

    background:
        rgba(0,0,0,.15);
}


/* ================================
   BASKET HIGHLIGHT
================================ */

.basket.highlight {

    transform: scale(1.12);

    box-shadow:
        0 0 0 5px white,
        0 0 25px rgba(0,0,0,.35);
}


/* ================================
   MESSAGE
================================ */

#message {

    position: absolute;

    left: 50%;
    top: 48%;

    transform:
        translate(-50%,-50%)
        scale(.7);

    padding:
        16px
        28px;

    background: white;

    border-radius: 25px;

    font-size: 25px;

    font-weight: bold;

    opacity: 0;

    pointer-events: none;

    z-index: 5000;

    box-shadow:
        0 8px 25px rgba(0,0,0,.25);

    transition:
        .2s;
}

#message.show {

    opacity: 1;

    transform:
        translate(-50%,-50%)
        scale(1);
}


/* ================================
   GAME OVER
================================ */

#gameOver {

    position: absolute;

    inset: 0;

    background:
        rgba(255,255,255,.97);

    display: none;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    z-index: 10000;

    text-align: center;
}

#gameOver h1 {

    font-size: 40px;

    margin-bottom: 20px;
}

#finalScore {

    font-size: 28px;

    font-weight: bold;

    margin-bottom: 25px;
}

#restart {

    border: none;

    background: #2563eb;

    color: white;

    padding:
        16px
        40px;

    border-radius: 30px;

    font-size: 19px;

    font-weight: bold;
}


/* ================================
   SMALL PHONE
================================ */

@media(max-width:380px) {

    #header {
        height: 64px;
    }

    #instruction {

        top: 75px;

        font-size: 14px;

        padding: 10px;
    }

    #basketArea {

        height: 155px;

        padding-bottom: 12px;
    }

    .basket {

        height: 75px;
    }

    .basket-label {

        font-size: 9px;
    }

    .color-object {

        width: 64px;
        height: 64px;

        font-size: 28px;
    }
}

</style>

</head>


<body>


<div id="game">


    <!-- HEADER -->

    <div id="header">

        <div class="stat">
            <small>SCORE</small>
            <strong id="score">0</strong>
        </div>

        <div class="stat">
            <small>ROUND</small>
            <strong id="round">1</strong>
        </div>

        <div class="stat">
            <small>LIVES</small>
            <strong id="lives">❤️❤️❤️</strong>
        </div>

        <div class="stat">
            <small>TIME</small>
            <strong id="time">60</strong>
        </div>

    </div>


    <!-- INSTRUCTION -->

    <div id="instruction">

        👆 DRAG THE OBJECT INTO THE
        <b>SAME COLOR</b> BASKET

    </div>


    <!-- BASKETS -->

    <div id="basketArea">


        <div class="basket-container">

            <div class="basket-label">
                RED
            </div>

            <div
                class="basket red"
                data-color="red">
            </div>

        </div>


        <div class="basket-container">

            <div class="basket-label">
                BLUE
            </div>

            <div
                class="basket blue"
                data-color="blue">
            </div>

        </div>


        <div class="basket-container">

            <div class="basket-label">
                YELLOW
            </div>

            <div
                class="basket yellow"
                data-color="yellow">
            </div>

        </div>


        <div class="basket-container">

            <div class="basket-label">
                GREEN
            </div>

            <div
                class="basket green"
                data-color="green">
            </div>

        </div>


        <div class="basket-container">

            <div class="basket-label">
                PURPLE
            </div>

            <div
                class="basket purple"
                data-color="purple">
            </div>

        </div>


    </div>


    <div id="message"></div>


    <!-- GAME OVER -->

    <div id="gameOver">

        <h1>🌟 Great Job!</h1>

        <div id="finalScore">
            Score: 0
        </div>

        <button id="restart">
            PLAY AGAIN
        </button>

    </div>


</div>



<script>


/* ==========================================
   VARIABLES
========================================== */

let score = 0;

let round = 1;

let lives = 3;

let timeLeft = 60;

let gameRunning = true;

let currentObject = null;

let timer = null;

let spawnTimer = null;

let objectCounter = 0;


/* ==========================================
   ELEMENTS
========================================== */

const game =
    document.getElementById("game");

const scoreEl =
    document.getElementById("score");

const roundEl =
    document.getElementById("round");

const livesEl =
    document.getElementById("lives");

const timeEl =
    document.getElementById("time");

const messageEl =
    document.getElementById("message");

const basketArea =
    document.getElementById("basketArea");

const gameOver =
    document.getElementById("gameOver");

const finalScore =
    document.getElementById("finalScore");

const restart =
    document.getElementById("restart");


/* ==========================================
   COLORS
========================================== */

const colors = [
    "red",
    "blue",
    "yellow",
    "green",
    "purple"
];


const emoji = {

    red: "🍎",

    blue: "💧",

    yellow: "⭐",

    green: "🍃",

    purple: "🫐"

};


/* ==========================================
   UPDATE UI
========================================== */

function updateUI() {

    scoreEl.textContent =
        score;

    roundEl.textContent =
        round;

    timeEl.textContent =
        timeLeft;


    let hearts = "";

    for (
        let i = 0;
        i < 3;
        i++
    ) {

        hearts +=
            i < lives
            ? "❤️"
            : "🖤";

    }

    livesEl.textContent =
        hearts;
}


/* ==========================================
   CREATE OBJECT
========================================== */

function createObject() {

    if (!gameRunning)
        return;


    /*
       Remove old object first.

       This makes the game easier to play
       for dementia/cognitive training:
       one object at a time.
    */

    if (currentObject) {

        currentObject.remove();

        currentObject = null;

    }


    const color =
        colors[
            Math.floor(
                Math.random()
                * colors.length
            )
        ];


    const object =
        document.createElement("div");


    object.className =
        "color-object " + color;


    object.dataset.color =
        color;


    object.dataset.id =
        objectCounter++;


    object.innerHTML =
        emoji[color];


    /*
       Start position.
    */

    const objectWidth = 72;


    const maxX =
        window.innerWidth
        - objectWidth
        - 10;


    const x =
        Math.random()
        * Math.max(
            10,
            maxX
        );


    object.style.left =
        x + "px";


    object.style.top =
        "155px";


    game.appendChild(object);


    currentObject =
        object;


    enableTouchDrag(object);


    startFalling(object);

}


/* ==========================================
   FALLING
========================================== */

function startFalling(object) {

    let y =
        parseFloat(
            object.style.top
        );


    let lastTime =
        performance.now();


    function animate(now) {

        if (!object.isConnected)
            return;


        /*
           STOP FALLING WHILE DRAGGING
        */

        if (
            object.classList
                .contains("dragging")
        ) {

            lastTime = now;

            requestAnimationFrame(
                animate
            );

            return;

        }


        const delta =
            (now - lastTime)
            / 1000;


        lastTime =
            now;


        y +=
            (35 + round * 2)
            * delta;


        /*
           Don't allow object to enter
           basket area automatically.
        */

        const basketTop =
            basketArea.getBoundingClientRect()
                .top;


        if (
            y + object.offsetHeight
            >= basketTop
        ) {

            object.remove();

            currentObject = null;

            loseLife();

            if (gameRunning) {

                setTimeout(
                    createObject,
                    300
                );

            }

            return;

        }


        object.style.top =
            y + "px";


        requestAnimationFrame(
            animate
        );

    }


    requestAnimationFrame(
        animate
    );
}


/* ==========================================
   MOBILE TOUCH DRAG
========================================== */

function enableTouchDrag(object) {


    let dragging = false;

    let offsetX = 0;

    let offsetY = 0;


    /*
       TOUCH START
    */

    object.addEventListener(
        "touchstart",
        function(event) {

            if (!gameRunning)
                return;


            /*
               Prevent scrolling.
            */

            event.preventDefault();


            const touch =
                event.touches[0];


            const rect =
                object.getBoundingClientRect();


            offsetX =
                touch.clientX
                - rect.left;


            offsetY =
                touch.clientY
                - rect.top;


            dragging = true;


            object.classList.add(
                "dragging"
            );


            /*
               Bring object completely
               above everything.
            */

            object.style.zIndex =
                "9999";

        },
        {
            passive: false
        }
    );


    /*
       TOUCH MOVE
    */

    object.addEventListener(
        "touchmove",
        function(event) {

            if (!dragging)
                return;


            event.preventDefault();


            const touch =
                event.touches[0];


            /*
               Calculate position based
               directly on finger.
            */

            let x =
                touch.clientX
                - offsetX;


            let y =
                touch.clientY
                - offsetY;


            /*
               Keep inside screen.
            */

            x =
                Math.max(
                    0,
                    Math.min(
                        x,
                        window.innerWidth
                        - object.offsetWidth
                    )
                );


            y =
                Math.max(
                    70,
                    Math.min(
                        y,
                        window.innerHeight
                        - object.offsetHeight
                    )
                );


            object.style.left =
                x + "px";


            object.style.top =
                y + "px";


            /*
               Check basket continuously.
            */

            highlightBasketAt(
                touch.clientX,
                touch.clientY
            );

        },
        {
            passive: false
        }
    );


    /*
       TOUCH END
    */

    object.addEventListener(
        "touchend",
        function(event) {

            if (!dragging)
                return;


            event.preventDefault();


            dragging = false;


            object.classList.remove(
                "dragging"
            );


            object.style.zIndex =
                "2000";


            removeBasketHighlight();


            /*
               IMPORTANT:
               Get the FINAL finger position.
            */

            const touch =
                event.changedTouches[0];


            const basket =
                findBasketAt(
                    touch.clientX,
                    touch.clientY
                );


            /*
               WE FOUND A BASKET
            */

            if (basket) {

                processDrop(
                    object,
                    basket
                );

            } else {

                /*
                   No basket.
                   Return object.
                */

                returnObject(object);

            }

        },
        {
            passive: false
        }
    );


    /*
       TOUCH CANCEL
    */

    object.addEventListener(
        "touchcancel",
        function() {

            dragging = false;

            object.classList.remove(
                "dragging"
            );

            removeBasketHighlight();

        }
    );

}


/* ==========================================
   FIND BASKET USING FINGER
========================================== */

function findBasketAt(
    x,
    y
) {

    const baskets =
        document.querySelectorAll(
            ".basket"
        );


    for (
        const basket of baskets
    ) {

        const rect =
            basket.getBoundingClientRect();


        /*
           LARGE DROP ZONE.

           The user doesn't need to
           place the object perfectly.
        */

        const padding = 25;


        if (

            x >=
            rect.left - padding

            &&

            x <=
            rect.right + padding

            &&

            y >=
            rect.top - padding

            &&

            y <=
            rect.bottom + padding

        ) {

            return basket;

        }

    }


    return null;
}


/* ==========================================
   HIGHLIGHT BASKET
========================================== */

function highlightBasketAt(
    x,
    y
) {

    removeBasketHighlight();


    const basket =
        findBasketAt(x, y);


    if (basket) {

        basket.classList.add(
            "highlight"
        );

    }

}


/* ==========================================
   REMOVE HIGHLIGHT
========================================== */

function removeBasketHighlight() {

    document
        .querySelectorAll(
            ".basket"
        )
        .forEach(
            basket => {

                basket.classList.remove(
                    "highlight"
                );

            }
        );

}


/* ==========================================
   PROCESS DROP
========================================== */

function processDrop(
    object,
    basket
) {

    const objectColor =
        object.dataset.color;


    const basketColor =
        basket.dataset.color;


    /*
       CORRECT COLOR
    */

    if (
        objectColor === basketColor
    ) {

        score += 10;

        round++;


        updateUI();


        basket.classList.add(
            "highlight"
        );


        showMessage(
            "✓ CORRECT! +10",
            true
        );


        /*
           Remove object.
        */

        object.remove();


        currentObject =
            null;


        setTimeout(
            function() {

                basket.classList.remove(
                    "highlight"
                );

            },
            400
        );


        /*
           New object.
        */

        setTimeout(
            createObject,
            500
        );


    } else {

        /*
           WRONG COLOR
        */

        score =
            Math.max(
                0,
                score - 5
            );


        updateUI();


        showMessage(
            "✗ TRY AGAIN",
            false
        );


        returnObject(object);

    }

}


/* ==========================================
   RETURN OBJECT
========================================== */

function returnObject(object) {

    if (!object.isConnected)
        return;


    object.animate(
        [
            {
                transform:
                    "scale(1)"
            },
            {
                transform:
                    "scale(1.25)"
            },
            {
                transform:
                    "scale(1)"
            }
        ],
        {
            duration: 400
        }
    );


    setTimeout(
        function() {

            if (
                object.isConnected
            ) {

                object.style.left =
                    (
                        Math.random()
                        *
                        (
                            window.innerWidth
                            - object.offsetWidth
                            - 10
                        )
                    ) + "px";


                object.style.top =
                    "155px";

            }

        },
        300
    );

}


/* ==========================================
   MESSAGE
========================================== */

function showMessage(
    text,
    correct
) {

    messageEl.textContent =
        text;


    messageEl.style.color =
        correct
        ? "#16a34a"
        : "#dc2626";


    messageEl.classList.add(
        "show"
    );


    setTimeout(
        function() {

            messageEl.classList.remove(
                "show"
            );

        },
        700
    );

}


/* ==========================================
   LOSE LIFE
========================================== */

function loseLife() {

    if (!gameRunning)
        return;


    lives--;


    updateUI();


    if (lives <= 0) {

        endGame();

    }

}


/* ==========================================
   TIMER
========================================== */

function startTimer() {

    timer =
        setInterval(
            function() {

                if (!gameRunning)
                    return;


                timeLeft--;


                updateUI();


                if (
                    timeLeft <= 0
                ) {

                    endGame();

                }

            },
            1000
        );

}


/* ==========================================
   GAME LOOP
========================================== */

function startGame() {

    score = 0;

    round = 1;

    lives = 3;

    timeLeft = 60;

    gameRunning = true;


    updateUI();


    createObject();


    startTimer();

}


/* ==========================================
   END GAME
========================================== */

function endGame() {

    gameRunning = false;


    clearInterval(timer);

    clearTimeout(spawnTimer);


    if (currentObject) {

        currentObject.remove();

        currentObject = null;

    }


    finalScore.textContent =
        "Score: " + score;


    gameOver.style.display =
        "flex";

}


/* ==========================================
   RESTART
========================================== */

restart.addEventListener(
    "click",
    function() {

        gameOver.style.display =
            "none";


        clearInterval(timer);


        startGame();

    }
);


/* ==========================================
   START
========================================== */

startGame();


</script>

</body>
</html>
