<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>Color Drop</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: linear-gradient(#dff6ff, #f8fbff);
    touch-action: none;
}

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

/* =========================
   HEADER
========================= */

#header {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 75px;

    display: flex;
    justify-content: space-around;
    align-items: center;

    background: rgba(255,255,255,0.94);
    box-shadow: 0 3px 12px rgba(0,0,0,0.12);

    z-index: 100;
}

.stat {
    text-align: center;
}

.stat-title {
    font-size: 13px;
    font-weight: bold;
    color: #666;
}

.stat-value {
    font-size: 22px;
    font-weight: bold;
    color: #222;
}

/* =========================
   INSTRUCTION
========================= */

#instruction {
    position: absolute;
    top: 88px;
    left: 50%;
    transform: translateX(-50%);

    width: 90%;
    max-width: 500px;

    padding: 12px 18px;

    background: white;
    border-radius: 18px;

    text-align: center;
    font-size: 17px;
    font-weight: bold;

    box-shadow: 0 4px 15px rgba(0,0,0,0.12);

    z-index: 90;
}

/* =========================
   PLAY AREA
========================= */

#playArea {
    position: absolute;
    left: 0;
    top: 150px;
    width: 100%;
    bottom: 175px;

    overflow: hidden;
}

/* =========================
   FALLING OBJECT
========================= */

.color-object {
    position: absolute;

    width: 68px;
    height: 68px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 30px;

    box-shadow:
        0 7px 12px rgba(0,0,0,0.20),
        inset 0 4px 5px rgba(255,255,255,0.45);

    border: 4px solid rgba(255,255,255,0.85);

    z-index: 50;

    touch-action: none;

    transition: transform 0.08s;
}

.color-object.dragging {
    transform: scale(1.18);
    box-shadow:
        0 12px 22px rgba(0,0,0,0.3),
        inset 0 4px 5px rgba(255,255,255,0.5);

    z-index: 200;
}

/* =========================
   BASKETS
========================= */

#baskets {
    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 165px;

    display: flex;
    justify-content: space-evenly;
    align-items: flex-end;

    padding: 10px 6px 15px;

    background: rgba(255,255,255,0.96);

    box-shadow: 0 -5px 18px rgba(0,0,0,0.13);

    z-index: 80;
}

.basket-container {
    width: 18%;
    max-width: 105px;

    display: flex;
    flex-direction: column;
    align-items: center;

    gap: 7px;
}

.basket-label {
    font-size: 14px;
    font-weight: bold;
    color: #333;
}

.basket {
    width: 100%;
    height: 90px;

    border-radius: 12px 12px 28px 28px;

    position: relative;

    display: flex;
    justify-content: center;
    align-items: flex-end;

    border: 5px solid rgba(255,255,255,0.9);

    box-shadow:
        inset 0 5px 5px rgba(255,255,255,0.35),
        0 5px 10px rgba(0,0,0,0.2);

    transition: transform 0.12s;
}

.basket::before {
    content: "";

    position: absolute;

    top: -10px;
    left: 4%;
    width: 92%;
    height: 20px;

    border-radius: 50%;

    background: rgba(0,0,0,0.12);
}

.basket.highlight {
    transform: scale(1.08);
}

.basket.correct {
    animation: basketCorrect 0.45s;
}

@keyframes basketCorrect {
    0% { transform: scale(1); }
    40% { transform: scale(1.15); }
    100% { transform: scale(1); }
}

/* =========================
   COLORS
========================= */

.red {
    background: #ff4d4d;
}

.blue {
    background: #3b82f6;
}

.yellow {
    background: #ffd43b;
}

.green {
    background: #35c759;
}

.purple {
    background: #a855f7;
}

/* =========================
   MESSAGE
========================= */

#message {
    position: absolute;

    left: 50%;
    top: 45%;

    transform: translate(-50%, -50%) scale(0.7);

    padding: 18px 30px;

    background: white;

    border-radius: 25px;

    font-size: 28px;
    font-weight: bold;

    opacity: 0;

    pointer-events: none;

    z-index: 500;

    box-shadow: 0 8px 30px rgba(0,0,0,0.2);

    transition: 0.25s;
}

#message.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
}

/* =========================
   GAME OVER
========================= */

#gameOver {
    position: absolute;

    inset: 0;

    background: rgba(255,255,255,0.96);

    display: none;

    flex-direction: column;

    justify-content: center;
    align-items: center;

    text-align: center;

    z-index: 1000;
}

#gameOver h1 {
    font-size: 42px;
    margin: 10px;
}

#finalScore {
    font-size: 30px;
    font-weight: bold;
    margin: 15px;
}

#restartBtn {
    border: none;

    padding: 18px 40px;

    font-size: 20px;
    font-weight: bold;

    color: white;

    background: #2563eb;

    border-radius: 30px;

    box-shadow: 0 6px 15px rgba(0,0,0,0.2);
}

#restartBtn:active {
    transform: scale(0.94);
}

/* =========================
   SMALL MOBILE
========================= */

@media (max-width: 380px) {

    #header {
        height: 65px;
    }

    #instruction {
        top: 75px;
        font-size: 14px;
    }

    #playArea {
        top: 130px;
        bottom: 160px;
    }

    #baskets {
        height: 150px;
    }

    .basket {
        height: 75px;
    }

    .basket-label {
        font-size: 11px;
    }

    .color-object {
        width: 60px;
        height: 60px;
    }
}
</style>
</head>

<body>

<div id="game">

    <!-- HEADER -->

    <div id="header">

        <div class="stat">
            <div class="stat-title">SCORE</div>
            <div id="score" class="stat-value">0</div>
        </div>

        <div class="stat">
            <div class="stat-title">ROUND</div>
            <div id="round" class="stat-value">1</div>
        </div>

        <div class="stat">
            <div class="stat-title">LIVES</div>
            <div id="lives" class="stat-value">❤️❤️❤️</div>
        </div>

        <div class="stat">
            <div class="stat-title">TIME</div>
            <div id="time" class="stat-value">60</div>
        </div>

    </div>

    <!-- INSTRUCTION -->

    <div id="instruction">
        🎯 Drag each object into the basket with the SAME COLOR
    </div>

    <!-- GAME AREA -->

    <div id="playArea"></div>

    <!-- BASKETS -->

    <div id="baskets">

        <div class="basket-container">
            <div class="basket-label">RED</div>
            <div class="basket red" data-color="red"></div>
        </div>

        <div class="basket-container">
            <div class="basket-label">BLUE</div>
            <div class="basket blue" data-color="blue"></div>
        </div>

        <div class="basket-container">
            <div class="basket-label">YELLOW</div>
            <div class="basket yellow" data-color="yellow"></div>
        </div>

        <div class="basket-container">
            <div class="basket-label">GREEN</div>
            <div class="basket green" data-color="green"></div>
        </div>

        <div class="basket-container">
            <div class="basket-label">PURPLE</div>
            <div class="basket purple" data-color="purple"></div>
        </div>

    </div>

    <!-- MESSAGE -->

    <div id="message"></div>

    <!-- GAME OVER -->

    <div id="gameOver">

        <h1>🌟 Great Job!</h1>

        <div id="finalScore">
            Score: 0
        </div>

        <button id="restartBtn">
            PLAY AGAIN
        </button>

    </div>

</div>

<script>

/* =========================================
   GAME VARIABLES
========================================= */

const playArea = document.getElementById("playArea");

const scoreDisplay = document.getElementById("score");
const roundDisplay = document.getElementById("round");
const livesDisplay = document.getElementById("lives");
const timeDisplay = document.getElementById("time");

const message = document.getElementById("message");

const gameOverScreen = document.getElementById("gameOver");
const finalScore = document.getElementById("finalScore");
const restartBtn = document.getElementById("restartBtn");

const colors = [
    "red",
    "blue",
    "yellow",
    "green",
    "purple"
];

let score = 0;
let lives = 3;
let timeLeft = 60;

let round = 1;

let objectCount = 0;

let gameRunning = true;

let timer;

let spawnTimer;


/* =========================================
   UPDATE UI
========================================= */

function updateUI() {

    scoreDisplay.textContent = score;

    roundDisplay.textContent = round;

    timeDisplay.textContent = timeLeft;

    let hearts = "";

    for (let i = 0; i < lives; i++) {
        hearts += "❤️";
    }

    for (let i = lives; i < 3; i++) {
        hearts += "🖤";
    }

    livesDisplay.textContent = hearts;
}


/* =========================================
   RANDOM NUMBER
========================================= */

function random(min, max) {

    return Math.random() * (max - min) + min;

}


/* =========================================
   SHOW MESSAGE
========================================= */

function showMessage(text, success = true) {

    message.textContent = text;

    message.style.color = success ? "#16a34a" : "#dc2626";

    message.classList.add("show");

    setTimeout(() => {

        message.classList.remove("show");

    }, 650);
}


/* =========================================
   CREATE OBJECT
========================================= */

function createObject() {

    if (!gameRunning) return;

    const color =
        colors[Math.floor(Math.random() * colors.length)];

    const object = document.createElement("div");

    object.className =
        "color-object " + color;

    object.dataset.color = color;

    object.dataset.id = objectCount++;

    /* Emoji gives the object a friendly appearance */

    const emojis = {
        red: "🍎",
        blue: "💧",
        yellow: "⭐",
        green: "🍃",
        purple: "🫐"
    };

    object.textContent = emojis[color];

    const areaWidth = playArea.clientWidth;

    const objectSize = 68;

    const x =
        random(10, Math.max(10, areaWidth - objectSize - 10));

    const y = 5;

    object.style.left = x + "px";
    object.style.top = y + "px";

    playArea.appendChild(object);

    makeDraggable(object);

    fallObject(object);
}


/* =========================================
   FALLING OBJECT
========================================= */

function fallObject(object) {

    let startTime = performance.now();

    let startY = parseFloat(object.style.top);

    let speed =
        20 + round * 2;

    function animate(currentTime) {

        if (!object.isConnected) return;

        if (object.classList.contains("dragging")) {

            requestAnimationFrame(animate);

            startTime = currentTime;

            startY = parseFloat(object.style.top);

            return;
        }

        const elapsed =
            (currentTime - startTime) / 1000;

        const newY =
            startY + elapsed * speed;

        object.style.top = newY + "px";

        if (
            newY >
            playArea.clientHeight + 20
        ) {

            object.remove();

            loseLife();

            return;
        }

        requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
}


/* =========================================
   TOUCH / POINTER DRAGGING
========================================= */

function makeDraggable(object) {

    let dragging = false;

    let offsetX = 0;
    let offsetY = 0;

    object.addEventListener(
        "pointerdown",
        function(e) {

            if (!gameRunning) return;

            dragging = true;

            object.classList.add("dragging");

            object.setPointerCapture(e.pointerId);

            const rect =
                object.getBoundingClientRect();

            offsetX =
                e.clientX - rect.left;

            offsetY =
                e.clientY - rect.top;

            e.preventDefault();
        }
    );


    object.addEventListener(
        "pointermove",
        function(e) {

            if (!dragging) return;

            const areaRect =
                playArea.getBoundingClientRect();

            let x =
                e.clientX -
                areaRect.left -
                offsetX;

            let y =
                e.clientY -
                areaRect.top -
                offsetY;

            /* Keep object inside game */

            const maxX =
                playArea.clientWidth -
                object.offsetWidth;

            const maxY =
                playArea.clientHeight -
                object.offsetHeight;

            x = Math.max(0, Math.min(x, maxX));

            y = Math.max(0, Math.min(y, maxY));

            object.style.left = x + "px";
            object.style.top = y + "px";

            highlightBasket(object);

            e.preventDefault();
        }
    );


    object.addEventListener(
        "pointerup",
        function(e) {

            if (!dragging) return;

            dragging = false;

            object.classList.remove("dragging");

            removeHighlights();

            checkDrop(object);

            e.preventDefault();
        }
    );


    object.addEventListener(
        "pointercancel",
        function() {

            dragging = false;

            object.classList.remove("dragging");

            removeHighlights();

        }
    );
}


/* =========================================
   FIND BASKET UNDER OBJECT
========================================= */

function getBasketUnderObject(object) {

    const objectRect =
        object.getBoundingClientRect();

    const objectCenterX =
        objectRect.left +
        objectRect.width / 2;

    const objectCenterY =
        objectRect.top +
        objectRect.height / 2;

    const baskets =
        document.querySelectorAll(".basket");

    for (const basket of baskets) {

        const rect =
            basket.getBoundingClientRect();

        if (
            objectCenterX >= rect.left &&
            objectCenterX <= rect.right &&
            objectCenterY >= rect.top &&
            objectCenterY <= rect.bottom
        ) {

            return basket;

        }

    }

    return null;
}


/* =========================================
   HIGHLIGHT BASKET
========================================= */

function highlightBasket(object) {

    removeHighlights();

    const basket =
        getBasketUnderObject(object);

    if (basket) {

        basket.classList.add("highlight");

    }
}


/* =========================================
   REMOVE HIGHLIGHTS
========================================= */

function removeHighlights() {

    document
        .querySelectorAll(".basket")
        .forEach(b => {

            b.classList.remove("highlight");

        });
}


/* =========================================
   CHECK DROP
========================================= */

function checkDrop(object) {

    const basket =
        getBasketUnderObject(object);

    if (!basket) {

        returnObject(object);

        return;
    }

    const objectColor =
        object.dataset.color;

    const basketColor =
        basket.dataset.color;

    if (objectColor === basketColor) {

        /* CORRECT */

        score += 10;

        basket.classList.add("correct");

        showMessage("✓ Correct! +10", true);

        updateUI();

        setTimeout(() => {

            basket.classList.remove("correct");

        }, 500);

        object.remove();

        round++;

        updateDifficulty();

    } else {

        /* WRONG */

        score =
            Math.max(0, score - 5);

        showMessage("Try Again! -5", false);

        updateUI();

        returnObject(object);

    }
}


/* =========================================
   RETURN OBJECT
========================================= */

function returnObject(object) {

    object.animate(
        [
            {
                transform: "scale(1)"
            },
            {
                transform: "scale(1.25)"
            },
            {
                transform: "scale(1)"
            }
        ],
        {
            duration: 400
        }
    );

    /* Put it back near top */

    setTimeout(() => {

        if (object.isConnected) {

            object.style.top = "5px";

        }

    }, 350);
}


/* =========================================
   WRONG / MISSED OBJECT
========================================= */

function loseLife() {

    if (!gameRunning) return;

    lives--;

    updateUI();

    if (lives <= 0) {

        endGame();

    }

}


/* =========================================
   DIFFICULTY
========================================= */

function updateDifficulty() {

    clearTimeout(spawnTimer);

    let spawnSpeed =
        Math.max(650, 1500 - round * 45);

    spawnTimer =
        setTimeout(
            spawnLoop,
            spawnSpeed
        );
}


/* =========================================
   SPAWN LOOP
========================================= */

function spawnLoop() {

    if (!gameRunning) return;

    createObject();

    let spawnSpeed =
        Math.max(
            650,
            1500 - round * 45
        );

    spawnTimer =
        setTimeout(
            spawnLoop,
            spawnSpeed
        );
}


/* =========================================
   TIMER
========================================= */

function startTimer() {

    timer =
        setInterval(() => {

            if (!gameRunning) return;

            timeLeft--;

            updateUI();

            if (timeLeft <= 0) {

                endGame();

            }

        }, 1000);

}


/* =========================================
   END GAME
========================================= */

function endGame() {

    gameRunning = false;

    clearInterval(timer);

    clearTimeout(spawnTimer);

    document
        .querySelectorAll(".color-object")
        .forEach(obj => obj.remove());

    finalScore.textContent =
        "Score: " + score;

    gameOverScreen.style.display =
        "flex";

}


/* =========================================
   RESTART
========================================= */

restartBtn.addEventListener(
    "click",
    restartGame
);


function restartGame() {

    clearInterval(timer);

    clearTimeout(spawnTimer);

    score = 0;

    lives = 3;

    timeLeft = 60;

    round = 1;

    objectCount = 0;

    gameRunning = true;

    document
        .querySelectorAll(".color-object")
        .forEach(obj => obj.remove());

    gameOverScreen.style.display =
        "none";

    updateUI();

    createObject();

    startTimer();

    spawnLoop();

}


/* =========================================
   START GAME
========================================= */

updateUI();

createObject();

startTimer();

spawnLoop();

</script>

</body>
</html>
