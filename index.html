<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DropColors - Mobile Arcade</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #111;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 750px;
            background: #1e1e2f;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
        }
        canvas {
            display: block;
            background: #181825;
            width: 100%;
            flex-grow: 1;
        }
        .ui-panel {
            padding: 12px 20px;
            background: #252538;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            border-bottom: 2px solid #33334d;
        }
        .lives {
            color: #ff5555;
            letter-spacing: 2px;
        }
        /* Overlay Screens */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 15, 25, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            text-align: center;
            padding: 20px;
        }
        h1 {
            font-size: 36px;
            margin-bottom: 10px;
            color: #ff79c6;
            text-shadow: 0 0 10px rgba(255,121,198,0.5);
        }
        p {
            color: #a4a4c1;
            margin-bottom: 25px;
            font-size: 15px;
            line-height: 1.4;
        }
        .btn {
            background: #50fa7b;
            color: #181825;
            border: none;
            padding: 14px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(80,250,123,0.4);
            transition: transform 0.1s ease;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Header UI -->
    <div class="ui-panel">
        <div id="score-display">Score: 0</div>
        <div id="lives-display" class="lives">❤️❤️❤️</div>
    </div>

    <!-- Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- Start Screen -->
    <div id="start-screen" class="overlay">
        <h1>DropColors</h1>
        <p>Swipe or drag horizontally to catch falling blocks with the **matching color lane** at the bottom. Don't let them hit the floor!</p>
        <button class="btn" onclick="startGame()">PLAY GAME</button>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="overlay hidden">
        <h1>Game Over</h1>
        <p>Final Score: <span id="final-score">0</span></p>
        <button class="btn" onclick="startGame()">PLAY AGAIN</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Handle high-DPI displays for crisp rendering
    function resizeCanvas() {
        const container = canvas.parentElement;
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Game variables
    let score = 0;
    let lives = 3;
    let gameRunning = false;
    let dropSpeed = 3;
    let spawnTimer = 0;
    let spawnInterval = 90; // frames

    // Color definitions (Red, Green, Blue, Yellow)
    const palette = [
        { name: 'red', hex: '#ff5555' },
        { name: 'green', hex: '#50fa7b' },
        { name: 'blue', hex: '#8be9fd' },
        { name: 'yellow', hex: '#f1fa8c' }
    ];

    // Catcher setup (divided into 4 lanes or movable bar with color segments)
    const catcher = {
        width: 110,
        height: 24,
        x: canvas.width / 2 - 55,
        y: canvas.height - 70,
        currentColorIndex: 0
    };

    let blocks = [];

    // Input handlers (Touch and Mouse drag)
    let isDragging = false;

    function handleTouchMove(e) {
        if (!gameRunning) return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const rect = canvas.getBoundingClientRect();
        const touchX = clientX - rect.left;
        catcher.x = touchX - catcher.width / 2;
        
        // Boundaries
        if (catcher.x < 0) catcher.x = 0;
        if (catcher.x > canvas.width - catcher.width) catcher.x = canvas.width - catcher.width;
    }

    canvas.addEventListener('mousedown', (e) => { isDragging = true; handleTouchMove(e); });
    window.addEventListener('mousemove', (e) => { if (isDragging) handleTouchMove(e); });
    window.addEventListener('mouseup', () => { isDragging = false; });

    canvas.addEventListener('touchstart', (e) => { isDragging = true; handleTouchMove(e); e.preventDefault(); }, {passive: false});
    window.addEventListener('touchmove', (e) => { if (isDragging) handleTouchMove(e); e.preventDefault(); }, {passive: false});
    window.addEventListener('touchend', () => { isDragging = false; });

    // Tap catcher to cycle color (Alternative/Bonus mobile control mechanic)
    canvas.addEventListener('click', () => {
        if (!gameRunning) return;
        catcher.currentColorIndex = (catcher.currentColorIndex + 1) % palette.length;
    });

    function startGame() {
        score = 0;
        lives = 3;
        dropSpeed = 3.5;
        spawnInterval = 80;
        blocks = [];
        gameRunning = true;
        
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('gameover-screen').classList.add('hidden');
        updateUI();
        
        requestAnimationFrame(gameLoop);
    }

    function gameOver() {
        gameRunning = false;
        document.getElementById('final-score').innerText = score;
        document.getElementById('gameover-screen').classList.remove('hidden');
    }

    function updateUI() {
        document.getElementById('score-display').innerText = `Score: ${score}`;
        document.getElementById('lives-display').innerText = '❤️'.repeat(lives);
    }

    function spawnBlock() {
        const colorObj = palette[Math.floor(Math.random() * palette.length)];
        const size = 32;
        const x = Math.random() * (canvas.width - size);
        blocks.push({
            x: x,
            y: -size,
            size: size,
            color: colorObj
        });
    }

    function update() {
        if (!gameRunning) return;

        // Spawner logic
        spawnTimer++;
        if (spawnTimer >= spawnInterval) {
            spawnBlock();
            spawnTimer = 0;
            // Progressive difficulty: speed up gradually
            if (spawnInterval > 35) spawnInterval -= 1;
            dropSpeed += 0.015;
        }

        // Update blocks
        for (let i = blocks.length - 1; i >= 0; i--) {
            let b = blocks[i];
            b.y += dropSpeed;

            // Check collision with catcher
            if (
                b.y + b.size >= catcher.y &&
                b.y <= catcher.y + catcher.height &&
                b.x + b.size >= catcher.x &&
                b.x <= catcher.x + catcher.width
            ) {
                // Check if color matches catcher's current color
                if (b.color.name === palette[catcher.currentColorIndex].name) {
                    score += 10;
                } else {
                    lives--;
                }
                updateUI();
                blocks.splice(i, 1);
                if (lives <= 0) {
                    gameOver();
                    return;
                }
                continue;
            }

            // Missed block (hit bottom)
            if (b.y > canvas.height) {
                blocks.splice(i, 1);
                lives--;
                updateUI();
                if (lives <= 0) {
                    gameOver();
                    return;
                }
            }
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw falling blocks
        blocks.forEach(b => {
            ctx.fillStyle = b.color.hex;
            ctx.beginPath();
            ctx.roundRect(b.x, b.y, b.size, b.size, 8);
            ctx.fill();
            // Inner glow effect
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();
        });

        // Draw Catcher (Dynamic color bar)
        const activeColor = palette[catcher.currentColorIndex];
        ctx.fillStyle = activeColor.hex;
        ctx.beginPath();
        ctx.roundRect(catcher.x, catcher.y, catcher.width, catcher.height, 12);
        ctx.fill();

        // Catcher border & indicator text
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.fillStyle = '#181825';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText("TAP TO SWITCH", catcher.x + catcher.width / 2, catcher.y + 16);
    }

    function gameLoop() {
        if (!gameRunning) return;
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }
</script>

</body>
</html>
